spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
app:
  bootstrap-super-admin:
    username: ${APP_BOOTSTRAP_SUPER_ADMIN_USERNAME}
    password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD}
  security:
    jwt:
      secret: ${APP_JWT_SECRET}
      lifetime-seconds: ${APP_JWT_LIFETIME_SECONDS:1800}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
