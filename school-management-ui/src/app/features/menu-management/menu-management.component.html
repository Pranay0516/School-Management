<article class="glass-card panel"><div class="panel-title"><div><p class="eyebrow">ADMIN ONLY</p><h2>Dynamic menu access</h2></div><div class="add-menu"><input [(ngModel)]="newMenu" placeholder="New menu name"><button class="primary-btn" (click)="add()">+ Add menu</button></div></div><p class="muted">Assign access to every menu for each role.</p><div class="menu-table"><div class="row heading"><span>Menu</span><span>Admin</span><span>Teacher</span><span>Student</span><span>Parent</span></div>@for(menu of menus();track menu.title){<div class="row"><b>{{menu.title}}</b>@for(role of roles;track role){<label class="check"><input type="checkbox" [checked]="menu.access.includes(role)" (change)="toggle(menu,role)"></label>}</div>}</div></article>
