
    <article class="glass-card panel">
      <ef-page-header
        eyebrow="STAFF DIRECTORY"
        title="Teachers"
        actionLabel="+ Add teacher"
        (action)="openAdd()" />

      <ef-search-bar
        [(query)]="search"
        placeholder="Search by name or subject"
        (search)="load($event)" />

      <ef-data-table [columns]="cols" style="--dt-cols: 2fr 1fr 1fr 1fr 1fr 80px">
        @for (t of teachers(); track t.id) {
          <div class="dt-row">
            <div>
              <b>{{ t.name }}</b>
              <small>{{ t.employeeId }}</small>
            </div>
            <span>{{ t.subject || '–' }}</span>
            <span>{{ t.className || '–' }}</span>
            <span>{{ t.phone || '–' }}</span>
            <ef-badge [variant]="t.status === 'ACTIVE' ? 'success' : 'neutral'">{{ t.status }}</ef-badge>
            <div class="row-actions">
              <button class="icon-btn" (click)="openEdit(t)">✎</button>
              <button class="icon-btn danger" (click)="remove(t)">✕</button>
            </div>
          </div>
        }
        @empty { <ef-empty icon="👩‍🏫" message="No teachers yet. Add one to get started." /> }
      </ef-data-table>

      @if (error()) { <p class="error-msg">{{ error() }}</p> }
    </article>

    @if (showModal()) {
      <ef-modal
        [eyebrow]="editing() ? 'EDIT TEACHER' : 'NEW TEACHER'"
        [title]="editing() ? 'Edit teacher details' : 'Add a teacher'"
        (close)="closeModal()">
        <form (ngSubmit)="save()">
          <div class="form-grid">
            <ef-form-field label="Employee ID">
              <input [(ngModel)]="draft.employeeId" name="employeeId" [disabled]="!!editing()" required />
            </ef-form-field>
            <ef-form-field label="Full Name">
              <input [(ngModel)]="draft.name" name="name" required />
            </ef-form-field>
            <ef-form-field label="Subject">
              <input [(ngModel)]="draft.subject" name="subject" />
            </ef-form-field>
            <ef-form-field label="Assigned Class">
              <input [(ngModel)]="draft.className" name="className" placeholder="e.g. X-A" />
            </ef-form-field>
            <ef-form-field label="Phone">
              <input [(ngModel)]="draft.phone" name="phone" />
            </ef-form-field>
            <ef-form-field label="Email">
              <input [(ngModel)]="draft.email" name="email" type="email" />
            </ef-form-field>
            <ef-form-field label="Status">
              <select [(ngModel)]="draft.status" name="status">
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
              </select>
            </ef-form-field>
          </div>
          @if (formError()) { <p class="error-msg">{{ formError() }}</p> }
          <div class="form-actions">
            <button type="button" class="outline-btn" (click)="closeModal()">Cancel</button>
            <button type="submit" class="primary-btn" [disabled]="saving()">
              {{ saving() ? 'Saving…' : (editing() ? 'Update teacher' : 'Add teacher') }}
            </button>
          </div>
        </form>
      </ef-modal>
    }
