spring:
  application:
    name: school-management-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:school_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
app:
  bootstrap-super-admin:
    username: ${APP_BOOTSTRAP_SUPER_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      lifetime-seconds: ${APP_JWT_LIFETIME_SECONDS:1800}
